<html>
<head>
<style>
body {
    background-color: grey;
    font-family: Arial;
    margin: 0;
}

#banner {
    background-color: lightblue;
    color: white;
    width: 100%;
    text-align: center;
    padding: 20px 0;
}

#details {
    display: flex;
    gap: 30px;
    margin: 30px;
}

#event-details {
    border: 3px solid black;
    background-color: pink;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
}

#registration-events {
    border: 3px solid black;
    background-color: lightyellow;
    padding: 20px;
    width: 50%;
    border-radius: 10px;
}

h1 {
    text-align: center;
}

h3 {
    color: purple;
}

button {
    padding: 10px 20px;
    background-color: green;
    animation-name:desk;
    animation-duration:5s;
    animation-iteration-count:5;
}

button:hover {
    background-color: purple;
}

@media screen and (max-width: 600px) {
    #details {
        flex-direction: column;
    }

    #event-details,
    #registration-events {
        width: auto;
     
    }
}


@keyframes desk
{
0%
{
transform:scale(1);
}
100%
{
transform:scale(1.5);
}
}

@keyframe mob
{
0%
{
opacity(0);
}
100%
{
opacity(1)
}
}
</style>
</head>

<body>

<div id="banner">
    <h1>STC | Pollachi</h1>
    <h2>TARANG</h2>
    <p>It is inter college meet fest, doing on 09-10-2026</p>
</div>

<div id="details">
    <div id="event-details">
        <h1>Event Details</h1>
        <h3>Quiz</h3>
        <h3>Connection</h3>
        <h3>Dancing</h3>
    </div>

    <div id="registration-events">
        <h1>Registration Details</h1>
        <h3>Registration fee is 150. It can be ended on 08-10-2026</h3>
    </div>
</div>
<center
<br><button>Submit</button></br>
</center>

</body>
</html>
